name: Deploy LTAT Dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::shinylive
            any::R6
            any::readxl
            any::writexl
            any::dplyr
            any::lubridate
            any::stringr
            any::reactable
            any::htmltools
            any::jsonlite

      - name: Export latest app version with Shinylive
        shell: Rscript {0}
        run: |
          files <- list.files("app", pattern = "^app_\\d+\\.\\d+\\.\\d+\\.R$", full.names = TRUE)
          stopifnot("No versioned app_X.Y.Z.R files found in app/" = length(files) > 0)
          vers <- numeric_version(sub("^app_(\\d+\\.\\d+\\.\\d+)\\.R$", "\\1", basename(files)))
          latest <- files[order(vers, decreasing = TRUE)][1]
          message("Selected latest script: ", latest)
          dir.create("build_app", showWarnings = FALSE)
          file.copy(latest, "build_app/app.R", overwrite = TRUE)
          shinylive::export("build_app", "site")

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
